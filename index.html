<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>DBMS Lab – Practice SQL in your browser</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="top">
    <h1>🗄️ DBMS Lab</h1>
    <p>Practice SQL and DBMS theory. Runs fully in your browser.</p>
    <nav class="tabs" id="tabs">
      <button data-view="practice" class="on">Practice</button>
      <button data-view="playground">Playground</button>
      <button data-view="quiz">Quiz</button>
    </nav>
  </header>

  <main>
    <p id="status" class="status">Loading SQL engine…</p>

    <section data-views="practice" class="card">
      <div class="qhead">
        <button id="prev" aria-label="Previous question">‹</button>
        <select id="qsel" aria-label="Choose question"></select>
        <button id="next" aria-label="Next question">›</button>
      </div>
      <p><span id="badge" class="badge"></span> <span id="progress" class="meta"></span></p>
      <h2 id="qtext"></h2>
      <div class="row">
        <button id="hintbtn">💡 Hint</button>
        <button id="solbtn">Show solution</button>
      </div>
      <p id="hint" class="hint" hidden></p>
      <pre id="solution" hidden></pre>
    </section>

    <section data-views="practice playground" class="card">
      <textarea id="sql" spellcheck="false" autocapitalize="off" rows="6" placeholder="Write SQL here…  (Ctrl+Enter to run)"></textarea>
      <div class="row">
        <button id="run" class="primary" disabled>▶ Run</button>
        <button id="check" data-views="practice" disabled>✔ Check answer</button>
        <button id="reset" disabled>Reset DB</button>
      </div>
      <p id="feedback" role="status"></p>
    </section>

    <section data-views="practice playground" id="result"></section>

    <details data-views="practice playground" class="card">
      <summary>Database tables (🔑 = primary key)</summary>
      <div id="schema"></div>
    </details>

    <section data-views="quiz" id="quiz" class="card" hidden></section>
  </main>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/sql.js/1.8.0/sql-wasm.js"></script>
  <script src="data.js"></script>
  <script src="app.js"></script>
</body>
</html>
